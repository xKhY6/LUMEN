[package]
name = "lumen"
version = "0.1.0"
edition = "2021"
description = "LUMEN - La citadelle silencieuse, un metroidvania 2D en Rust et Macroquad"

[dependencies]
egui-macroquad = "0.17"
rfd = "0.15"
gilrs = "0.11"
hound = "3.5"
image = { version = "0.24", default-features = false, features = ["png"] }
macroquad = { version = "0.4", default-features = false, features = ["audio"] }
macroquad-platformer = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
